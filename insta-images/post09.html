<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#080810;font-family:'Noto Serif JP',serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(200,210,240,0.08) 0%,transparent 55%)}
.corner{position:absolute;width:40px;height:40px}.corner::before,.corner::after{content:'';position:absolute;background:#c9a84c}.corner::before{width:100%;height:1px;top:0;left:0}.corner::after{width:1px;height:100%;top:0;left:0}
.tl{top:32px;left:32px}.tr{top:32px;right:32px;transform:scaleX(-1)}.bl{bottom:32px;left:32px;transform:scaleY(-1)}.br{bottom:32px;right:32px;transform:scale(-1)}
.c{position:relative;z-index:1;text-align:center;padding:0 60px}
.icon{font-size:70px;margin-bottom:24px}
.title{font-size:36px;color:#c9a84c;letter-spacing:0.12em;line-height:1.6;margin-bottom:36px;font-weight:700}
.list{text-align:left;display:flex;flex-direction:column;gap:16px;margin-bottom:36px}
.list-item{display:flex;gap:12px;font-size:20px;color:#e0ddd5;line-height:1.5}
.list-item .mark{color:#c8d4f0;flex-shrink:0}
.brand{font-size:13px;color:rgba(201,168,76,0.5);letter-spacing:0.3em}
</style></head><body>
<div class="bg"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="c">
  <div class="icon">🌕</div>
  <h1 class="title">守護石の<br>正しい浄化タイミング</h1>
  <div class="list">
    <div class="list-item"><span class="mark">✦</span>買ったばかりの時 → 必ず</div>
    <div class="list-item"><span class="mark">✦</span>毎日身につけている → 週1回</div>
    <div class="list-item"><span class="mark">✦</span>人混みに行った後 → その日のうちに</div>
    <div class="list-item"><span class="mark">✦</span>満月の夜 → 月光浴がベスト</div>
    <div class="list-item"><span class="mark">✦</span>嫌なことがあった日 → すぐに</div>
  </div>
  <p class="brand">叶結 — kanau musubi</p>
</div></body></html>
