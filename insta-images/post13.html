<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#080810;font-family:'Noto Serif JP',serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(123,94,167,0.09) 0%,transparent 60%)}
.corner{position:absolute;width:40px;height:40px}.corner::before,.corner::after{content:'';position:absolute;background:#c9a84c}.corner::before{width:100%;height:1px;top:0;left:0}.corner::after{width:1px;height:100%;top:0;left:0}
.tl{top:32px;left:32px}.tr{top:32px;right:32px;transform:scaleX(-1)}.bl{bottom:32px;left:32px;transform:scaleY(-1)}.br{bottom:32px;right:32px;transform:scale(-1)}
.c{position:relative;z-index:1;text-align:center;padding:0 80px}
.title{font-size:34px;color:#c9a84c;letter-spacing:0.1em;line-height:1.7;margin-bottom:40px;font-weight:700}
.answer{font-size:44px;color:#e0ddd5;letter-spacing:0.1em;margin-bottom:48px;line-height:1.5;font-weight:600}
.answer span{color:#c9a84c}
.msg{font-size:22px;color:#8a8680;line-height:1.9;margin-bottom:40px}
.brand{font-size:13px;color:rgba(201,168,76,0.5);letter-spacing:0.3em}
</style></head><body>
<div class="bg"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="c">
  <h1 class="title">スピリチュアルにハマる人が<br>最初に手放すべきもの</h1>
  <p class="answer"><span>「正解を求める心」</span></p>
  <p class="msg">正解を探すほど迷子になる。<br>正解を手放した瞬間に<br>直感が動き始める。</p>
  <p class="brand">叶結 — kanau musubi</p>
</div></body></html>
