<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#080810;font-family:'Noto Serif JP',serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(201,168,76,0.12) 0%,transparent 60%)}
.corner{position:absolute;width:40px;height:40px}.corner::before,.corner::after{content:'';position:absolute;background:#c9a84c}.corner::before{width:100%;height:1px;top:0;left:0}.corner::after{width:1px;height:100%;top:0;left:0}
.tl{top:32px;left:32px}.tr{top:32px;right:32px;transform:scaleX(-1)}.bl{bottom:32px;left:32px;transform:scaleY(-1)}.br{bottom:32px;right:32px;transform:scale(-1)}
.c{position:relative;z-index:1;text-align:center;padding:0 80px}
.label{font-size:13px;color:#c9a84c;letter-spacing:0.4em;margin-bottom:32px}
.count{font-size:120px;color:#c9a84c;line-height:1;margin-bottom:16px;font-weight:700;letter-spacing:-0.02em}
.count span{font-size:40px;color:#8a8680;margin-left:8px}
.title{font-size:34px;color:#e0ddd5;letter-spacing:0.1em;line-height:1.6;margin-bottom:48px;font-weight:700}
.msg{font-size:22px;color:#8a8680;line-height:1.9;margin-bottom:40px}
.msg em{color:#c9a84c;font-style:normal}
.cta{display:inline-block;padding:16px 40px;border:1px solid #c9a84c;color:#c9a84c;font-size:14px;letter-spacing:0.2em;margin-top:16px}
.pager{position:absolute;bottom:48px;left:0;right:0;display:flex;justify-content:center;font-size:11px;color:rgba(201,168,76,0.4);letter-spacing:0.2em}
</style></head><body>
<div class="bg"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="c">
  <p class="label">RESULT</p>
  <div class="count">3<span>つ以上？</span></div>
  <h1 class="title">あなたの直感は<br>今、かなり冴えています</h1>
  <p class="msg"><em>その感覚を信じて動いてください。</em><br>直感は使うほど鋭くなります。</p>
  <div class="cta">詳しい鑑定は → @kanau_musubi</div>
</div>
<div class="pager">6 / 7</div>
</body></html>
